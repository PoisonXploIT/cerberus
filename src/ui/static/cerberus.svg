<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CERBERUS">
  <defs>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fadf95"/>
      <stop offset="0.55" stop-color="#efb43f"/>
      <stop offset="1" stop-color="#cf8f16"/>
