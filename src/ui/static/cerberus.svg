    <g transform="rotate(-34)">
      <path d="M-6 0 L-8 -13 L-13 -23 L-7 -19 L-3 -29 L0 -37 L3 -29 L7 -19 L13 -23 L8 -13 L6 0 Z" fill="url(#fur)"/>
      <circle cx="-4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <circle cx="4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <path d="M-3.4 -30 L3.4 -30" stroke="#0b0e12" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <path d="M-6 0 L-8 -13 L-13 -23 L-7 -19 L-3 -29 L0 -37 L3 -29 L7 -19 L13 -23 L8 -13 L6 0 Z" fill="url(#fur)"/>
      <circle cx="-4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <circle cx="4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <path d="M-3.4 -30 L3.4 -30" stroke="#0b0e12" stroke-width="1.4" fill="none"/>
    </g>
    <g transform="rotate(34)">
      <path d="M-6 0 L-8 -13 L-13 -23 L-7 -19 L-3 -29 L0 -37 L3 -29 L7 -19 L13 -23 L8 -13 L6 0 Z" fill="url(#fur)"/>
      <circle cx="-4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <circle cx="4.2" cy="-20" r="1.7" fill="#0b0e12" stroke="none"/>
      <path d="M-3.4 -30 L3.4 -30" stroke="#0b0e12" stroke-width="1.4" fill="none"/>
    </g>
    <!-- Collar: base común de las tres cabezas -->
    <path d="M-9 1 Q0 7 9 1 L9 6 Q0 12 -9 6 Z" fill="#0b0e12" stroke="none" opacity=".9"/>
  </g>
</svg>
